<script>
// =========================================================================
// POLYFILL GOOGLE.SCRIPT.RUN UNTUK GITHUB PAGES / HOSTING EKSTERNAL
// =========================================================================
// PENTING: Jika Anda meng-host file HTML ini di GitHub Pages, masukkan URL Web App Google Apps Script Anda di bawah ini!
const EXTERNAL_GAS_URL = "https://script.google.com/macros/s/AKfycbxPlsu_4J2o1b_ScpkfbIXg4-6OGtw8FsTfwiU2jATXRjRnVTwaD08sYV4hATx3km7y/exec"; // Contoh: "https://script.google.com/macros/s/AKfycby.../exec"

if (typeof google === 'undefined') {
  window.google = {
    script: {
      run: new Proxy({}, {
        get: function(target, prop) {
          if (prop === 'withSuccessHandler') {
            return function(cb) { target._success = cb; return window.google.script.run; };
          }
          if (prop === 'withFailureHandler') {
            return function(cb) { target._failure = cb; return window.google.script.run; };
          }
          
          return function(...args) {
            var successCb = target._success;
            var failureCb = target._failure;
            target._success = null; target._failure = null;
            
            if (!EXTERNAL_GAS_URL) {
              console.error("EXTERNAL_GAS_URL belum diisi! Silakan isi URL Web App GAS Anda di kode HTML/JS.");
              if (failureCb) failureCb(new Error("URL GAS belum dikonfigurasi."));
              return;
            }

            // Menggunakan method POST dengan body text/plain untuk membypass preflight CORS Google
            fetch(EXTERNAL_GAS_URL, {
              method: 'POST',
              body: JSON.stringify({ action: prop, args: args }),
              headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(function(r) { return r.json(); })
            .then(function(res) { if (successCb) successCb(res); })
            .catch(function(err) { if (failureCb) failureCb(err); });
          };
        }
      })
    }
  };
}
// =========================================================================

    /* UTILS & UI CORE */
    var rp = (n) => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
    var getEl = (id) => document.getElementById(id);

        var queueDisplay = {
          timer: null,
          clockTimer: null,
          _keepAliveTimer: null,
          lastReadyIds: [],
          lastCallQueueId: null,
          isAnnouncing: false,
          isActive: false,
          _audioCtx: null,
          _getAudioCtx: function() {
              if (!this._audioCtx) {
                  try { this._audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
              }
              return this._audioCtx;
          },
          init: function() {
              this.isActive = true;
              ui.showView('view-queue-display');
              if (document.documentElement.requestFullscreen) {
                  document.documentElement.requestFullscreen().catch(function(){});
              }
              // Unlock AudioContext (triggered by user click — always works)
              var ctx = queueDisplay._getAudioCtx();
              if (ctx && ctx.state === 'suspended') ctx.resume();

              // Prime Google TTS Audio Element to bypass Autoplay restrictions on Web TV/iOS
              var player = getEl('qd-audio-tts');
              if (!player) {
                  player = document.createElement('audio');
                  player.id = 'qd-audio-tts';
                  player.style.display = 'none';
                  // Ultra-short silent MP3 to satisfy mobile autoplay policies
                  player.src = 'data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYxLjEuMTAwAAAAAAAAAAAAAAD/+0DAAAAAAAAAAAAAAAAAAAAAAABqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq';
                  document.body.appendChild(player);
              }
              player.volume = 0; // Mute for priming
              var p = player.play();
              if (p !== undefined) {
                  p.then(function() { player.pause(); player.volume = 1; }).catch(function(){});
              } else {
                  player.pause(); player.volume = 1;
              }

              // Prime SpeechSynthesis: fire a silent utterance to unlock it on mobile
              if ('speechSynthesis' in window) {
                  window.speechSynthesis.cancel();
                  var primer = new SpeechSynthesisUtterance(' ');
                  primer.volume = 0;
                  primer.rate = 2;
                  window.speechSynthesis.speak(primer);
                  // Load voices (needed on Chrome Android before first speech)
                  window.speechSynthesis.getVoices();
              }

              // Android Chrome keep-alive: speechSynthesis pauses if tab idle > 15s
              this._keepAliveTimer = setInterval(function() {
                  if (!queueDisplay.isActive) return;
                  if ('speechSynthesis' in window && window.speechSynthesis.paused) {
                      window.speechSynthesis.resume();
                  }
              }, 5000);

              var updateClock = function() {
                  var el = getEl('qd-clock');
                  if (el) el.innerText = new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
              };
              updateClock();
              this.clockTimer = setInterval(updateClock, 1000);
              this.fetchData();
              this.timer = setInterval(function() { if (queueDisplay.isActive) queueDisplay.fetchData(); }, 5000);
          },
          exit: function() {
              this.isActive = false;
              this.isAnnouncing = false;
              this.lastCallQueueId = null;
              clearInterval(this.timer);
              clearInterval(this.clockTimer);
              clearInterval(this._keepAliveTimer);
              // Stop all speech immediately
              if ('speechSynthesis' in window) window.speechSynthesis.cancel();
              // Close AudioContext to release resources
              if (this._audioCtx) {
                  try { this._audioCtx.close(); } catch(e) {}
                  this._audioCtx = null;
              }
              if (document.fullscreenElement) document.exitFullscreen();
              ui.showView('view-portal-select');
          },
          fetchData: function() {
              google.script.run.withSuccessHandler(function(res) {
                  if (!queueDisplay.isActive) return;
                  if (res.success) {
                      queueDisplay._lastData = res;
                      queueDisplay.render(res);
                      if (res.callQueueId && res.callQueueId !== queueDisplay.lastCallQueueId) {
                          var isFirstLoad = (queueDisplay.lastCallQueueId === null);
                          queueDisplay.lastCallQueueId = res.callQueueId;
                          // Format: "A-003_1748000000000_2"   parts[0]=qNum, parts[last]=playCount
                          var parts = res.callQueueId.split('_');
                          var qNum = parts[0];
                          var playCount = parseInt(parts[parts.length - 1]) || 1;

                          var mainEl = getEl('qd-ready-main');
                          mainEl.innerText = qNum;
                          mainEl.style.transform = 'scale(0.8)';
                          mainEl.style.opacity = '0';
                          setTimeout(function() {
                              mainEl.style.transform = 'scale(1)';
                              mainEl.style.opacity = '1';
                          }, 50);
                          
                          // Jangan panggil suara jika ini adalah load pertama saat portal baru dibuka
                          if (!isFirstLoad) {
                              queueDisplay.isAnnouncing = true;
                              queueDisplay.playAnnouncement(qNum, playCount);
                          }
                      }
                  }
              }).getActiveQueues();
          },
          render: function(res) {
              var data = res.data || [];
              var processing = data.filter(function(q) { return q.status === 'Masuk' || q.status === 'Diproses'; }).slice(0, 7);

              var lCont = getEl('qd-logo-container');
              var l = getEl('qd-logo');
              if (res.StoreLogo) {
                  l.src = res.StoreLogo;
                  if (lCont) lCont.style.display = 'flex'; else l.style.display = 'block';
              } else {
                  if (lCont) lCont.style.display = 'none'; else l.style.display = 'none';
              }
              getEl('qd-store-name').innerText = res.StoreName || 'My Kasir';

              getEl('qd-processing-list').innerHTML = processing.map(function(q) {
                  return '<div style="background:rgba(255,255,255,0.05);border-left:4px solid #38bdf8;border-radius:12px;padding:20px;text-align:center;font-size:3.5vw;font-weight:800;color:#f8fafc;box-shadow:0 4px 15px rgba(0,0,0,0.1);transition:transform 0.3s;" class="anim-fade-up">' + q.qNum + '</div>';
              }).join('');
              // NOTE: qd-ready-main is NEVER updated here.
              // It only changes when the cashier explicitly presses "Selesai & Panggil" or "Panggil Lagi",
              // which sets a new QUEUE_CALL_ID on the server → detected in fetchData above.
          },
          // Bel via Web Audio API — 3 ascending tones, works on all devices
          _playBel: function(onDone) {
              var ctx = this._getAudioCtx();
              if (!ctx) { setTimeout(onDone, 300); return; }
              var belDone = false;
              var safeBelDone = function() { if (!belDone) { belDone = true; onDone(); } };
              try {
                  if (ctx.state === 'suspended') ctx.resume();
                  var playTing = function(freq, startTime, gain) {
                      var osc = ctx.createOscillator();
                      var gainNode = ctx.createGain();
                      osc.connect(gainNode);
                      gainNode.connect(ctx.destination);
                      osc.type = 'sine';
                      osc.frequency.value = freq;
                      gainNode.gain.setValueAtTime(gain, startTime);
                      gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.9);
                      osc.start(startTime);
                      osc.stop(startTime + 0.9);
                  };
                  var t = ctx.currentTime;
                  playTing(880,  t,        0.6);
                  playTing(1047, t + 0.38, 0.5);
                  playTing(1319, t + 0.76, 0.45);
                  setTimeout(safeBelDone, 1400);
              } catch(e) { setTimeout(safeBelDone, 300); }
          },
          // Speak once — Primary: Base64 Web Audio API (bypasses ALL CORS/Autoplay policies), Fallback: SpeechSynthesis
          _speakOnce: function(txt, onDone) {
              if (!queueDisplay.isActive) { onDone(); return; }
              var done = false;
              var safeDone = function() {
                  if (!done) { done = true; onDone(); }
              };

              // PRIMARY: ResponsiveVoice.js
              // Paling efektif untuk lintas browser (Web TV, iOS, Android, Desktop)
              if (typeof responsiveVoice !== 'undefined') {
                  if (responsiveVoice.isPlaying()) responsiveVoice.cancel();
                  responsiveVoice.speak(txt, "Indonesian Female", {
                      pitch: 1,
                      rate: 0.9,
                      volume: 1,
                      onend: safeDone,
                      onerror: safeDone
                  });
                  
                  // Failsafe timeout just in case ResponsiveVoice gets stuck
                  var estMs = Math.max(5000, txt.length * 110 + 2000);
                  setTimeout(safeDone, estMs);
                  return;
              }

              // FALLBACK (Jika ResponsiveVoice gagal dimuat karena koneksi)
              var trySynth = function() {
                  if (!('speechSynthesis' in window)) { safeDone(); return; }
                  var msg = new SpeechSynthesisUtterance(txt);
                  msg.lang = 'id-ID';
                  msg.rate = 0.85;
                  
                  var voices = window.speechSynthesis.getVoices();
                  var idVoice = null;
                  for (var i = 0; i < voices.length; i++) {
                      if (voices[i].lang.toLowerCase().indexOf('id') === 0) { idVoice = voices[i]; break; }
                  }
                  if (idVoice) msg.voice = idVoice;

                  var synthDone = false;
                  var safeSynthDone = function() {
                      if (!synthDone) { synthDone = true; safeDone(); }
                  };
                  var estMs = Math.max(4000, txt.length * 90 + 1500);
                  var fallback = setTimeout(safeSynthDone, estMs);

                  msg.onend = function() { clearTimeout(fallback); safeSynthDone(); };
                  msg.onerror = function() { clearTimeout(fallback); safeSynthDone(); };
                  window.speechSynthesis.speak(msg);
              };
              
              trySynth();
          },
          // Main: 1x bel → speech N times  (1x="Panggil Lagi", 2x="Selesai & Panggil")
          playAnnouncement: function(qNum, playCount) {
              if (!queueDisplay.isActive) return;
              // Hard cap: maximum 2 repeats, minimum 1
              playCount = Math.min(Math.max(playCount || 1, 1), 2);
              var txt = 'Nomor antrean ' + qNum + ', pesanan anda sudah siap';
              var self = queueDisplay;

              var onAllDone = function() {
                  self.isAnnouncing = false;
                  // IMPORTANT: do NOT reset lastCallQueueId to null here!
                  // If we do, the next fetchData poll will see the same callQueueId on the server
                  // and think it's a new call, replaying the bel+speech indefinitely.
                  // lastCallQueueId stays as the current value — only changes when a NEW call arrives.
              };

              // Play bel ONCE at the start, then repeat speech exactly playCount times
              self._playBel(function() {
                  var totalCalled = 0; // absolute counter — hard stop at playCount
                  var doSpeech = function() {
                      if (!self.isActive) { onAllDone(); return; }
                      if (totalCalled >= playCount) { onAllDone(); return; }
                      totalCalled++;
                      var isLast = (totalCalled >= playCount);
                      self._speakOnce(txt, function() {
                          if (!self.isActive || isLast) {
                              onAllDone();
                          } else {
                              setTimeout(doSpeech, 900);
                          }
                      });
                  };
                  doSpeech();
              });
          }
        };

        var ui = {
      _views: ['view-portal-select', 'view-login-form', 'view-main-app', 'view-queue-display'],
      showView: function (id) {
        var self = this;
        self._views.forEach(function (v) {
          var el = getEl(v);
          if (el) el.style.display = 'none';
        });
        var target = getEl(id);
        if (!target) return;
        if (id === 'view-main-app') {
          target.style.display = 'flex';
        } else {
          target.style.display = 'flex';
          // Re-trigger animations
          target.querySelectorAll('[class*="anim-"]').forEach(function (el) {
            el.style.animation = 'none';
            el.offsetHeight; // reflow
            el.style.animation = '';
          });
        }
      },
      showLogin: function (role) {
        getEl('login-role').value = role;
        getEl('login-title').innerText = 'Login ' + role;
        getEl('login-icon').className = role === 'Owner' ? 'fas fa-user-tie' : 'fas fa-cash-register';
        getEl('inp-username').value = '';
        getEl('inp-password').value = '';
        this.showView('view-login-form');
        setTimeout(function () { getEl('inp-username').focus(); }, 200);
      },
      openModal: function (id) { var el = getEl(id); if (el) el.classList.add('show'); },
      closeModal: function (id) { var el = getEl(id); if (el) el.classList.remove('show'); },
      showConfirm: function(title, msg, onConfirm) {
        getEl('mc-confirm-title').innerText = title || 'Konfirmasi';
        getEl('mc-confirm-msg').innerText = msg || 'Apakah Anda yakin?';
        var btn = getEl('mc-confirm-btn');
        btn.onclick = function() {
          ui.closeModal('modal-confirm');
          if (onConfirm) onConfirm();
        };
        ui.openModal('modal-confirm');
      },
      showToast: function (msg, type) {
        type = type || 'success';
        var c = getEl('toast-container');
        var t = document.createElement('div');
        t.className = 'toast ' + type;
        var icon = type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle';
        t.innerHTML = '<i class="fas fa-' + icon + '"></i> <span>' + msg + '</span>';
        t.style.cssText = 'pointer-events:auto;display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,0.2);backdrop-filter:blur(10px);opacity:0;transform:translateY(12px) scale(0.95);transition:all 0.35s cubic-bezier(.22,1,.36,1);' + (type === 'success' ? 'background:#22c55e;color:#fff;' : type === 'error' ? 'background:#ef4444;color:#fff;' : 'background:#f59e0b;color:#fff;');
        c.appendChild(t);
        setTimeout(function () { t.style.opacity = '1'; t.style.transform = 'translateY(0) scale(1)'; }, 10);
        setTimeout(function () { t.style.opacity = '0'; t.style.transform = 'translateY(-8px) scale(0.95)'; setTimeout(function () { if (t.parentNode) t.remove(); }, 350); }, 3500);
      },
      showLoader: function (msg) { var l = getEl('loader'); if (l) { l.style.display = 'flex'; getEl('loader-text').innerText = msg || 'Memuat...'; } },
      hideLoader: function () { var l = getEl('loader'); if (l) l.style.display = 'none'; },
      toggleTheme: function () {
        var isDark = document.body.classList.toggle('dark');
        var btn = getEl('btn-theme');
        if (btn) btn.classList.toggle('on', isDark);
        localStorage.setItem('mykasir_theme', isDark ? 'dark' : 'light');
      },
      initTheme: function () {
        if (localStorage.getItem('mykasir_theme') === 'dark') {
          document.body.classList.add('dark');
          var btn = getEl('btn-theme');
          if (btn) btn.classList.add('on');
        }
      },
      enterFullscreen: function() {
        try {
          var el = document.documentElement;
          if (el.requestFullscreen) { el.requestFullscreen(); }
          else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
          else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
          else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
        } catch(e) { console.log(e); }
      },
      exitFullscreen: function() {
        try {
          if (document.exitFullscreen) { document.exitFullscreen(); }
          else if (document.mozCancelFullScreen) { document.mozCancelFullScreen(); }
          else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
          else if (document.msExitFullscreen) { document.msExitFullscreen(); }
        } catch(e) { console.log(e); }
      }
    };

    /* APP STATE & CORE DATA */
    var app = {
      state: {
        user: null, role: null, nama: null,
        data: { stock: [], catalog: [], transactions: [], expenses: [], settings: {} },
        cart: [], paymentMethod: 'Cash',
        chartInstance: null
      },
      init: function () { ui.initTheme(); },
      loadDashboard: function () {
        ui.showLoader('Mengambil data aplikasi...');
        google.script.run
          .withSuccessHandler(function (data) {
            ui.hideLoader();
            if (data.error) return ui.showToast(data.error, 'error');
            app.state.data = data;
            app.setupAppViews();
          })
          .withFailureHandler(function (err) { ui.hideLoader(); ui.showToast(err.message, 'error'); })
          .getDashboardData();
      },
      refreshData: function () {
        ui.showLoader('Sinkronisasi...');
        google.script.run
          .withSuccessHandler(function (data) {
            ui.hideLoader();
            app.state.data = data;
            ui.showToast('Data diperbarui');
                          if (app.state.role === 'Kasir') {
                kasir.renderCatalog();
                if (String(app.state.data.settings.RequireOrderType) === 'true') {
                   getEl('k-ordertype-container').classList.remove('hidden');
                   if(!app.state.currentOrderType) kasir.setOrderType('Dine In');
                } else {
                   getEl('k-ordertype-container').classList.add('hidden');
                   app.state.currentOrderType = '';
                }
              }
              else {
              owner.populateSelects();
              owner.refreshCurrentTab();
            }
          })
          .getDashboardData();
      },
      setupAppViews: function () {
        var st = app.state;
        getEl('nav-store-name').innerText = st.data.settings.StoreName || 'My Kasir';
        getEl('nav-username').innerText = st.user;
        getEl('nav-role-badge').innerText = st.role;
        ui.showView('view-main-app');
        if (st.role === 'Kasir') {
          getEl('portal-kasir').classList.remove('hidden');
          getEl('portal-kasir').style.display = 'flex';
          getEl('portal-owner').classList.add('hidden');
          getEl('portal-owner').style.display = 'none';
          kasir.init();
        } else {
          getEl('portal-owner').classList.remove('hidden');
          getEl('portal-owner').style.display = 'flex';
          getEl('portal-kasir').classList.add('hidden');
          getEl('portal-kasir').style.display = 'none';
          owner.init();
        }
      }
    };

    /* AUTHENTICATION */
    var auth = {
      login: function () {
        var u = getEl('inp-username').value;
        var p = getEl('inp-password').value;
        var r = getEl('login-role').value;
        if (!u || !p) { ui.showToast('Isi username dan password!', 'error'); return; }
        ui.showLoader('Memverifikasi...');
        google.script.run
          .withSuccessHandler(function (res) {
            if (res.success) {
              app.state.user = res.username;
              app.state.role = res.role;
              app.state.nama = res.namaKaryawan;
              ui.showToast('Selamat datang, ' + (res.namaKaryawan || res.username) + '!');
              app.loadDashboard();
            } else {
              ui.hideLoader();
              ui.showToast(res.message, 'error');
            }
          })
          .withFailureHandler(function (err) { ui.hideLoader(); ui.showToast(err.message, 'error'); })
          .processLogin(u, p, r);
      },
      logout: function () {
        app.state.isFullscreenMode = false;
        ui.exitFullscreen();
        app.state.user = null; app.state.role = null; app.state.cart = [];
        ui.showView('view-portal-select');
      }
    };

    /* KASIR MODULE */
    var kasir = {
        setOrderType: function (type) {
          app.state.currentOrderType = type;
          if (type === 'Dine In') {
            if(getEl('btn-type-dinein')){
              getEl('btn-type-dinein').style.background = 'var(--primary)';
              getEl('btn-type-dinein').style.color = '#fff';
              getEl('btn-type-takeaway').style.background = 'transparent';
              getEl('btn-type-takeaway').style.color = 'var(--t2)';
            }
          } else {
            if(getEl('btn-type-takeaway')){
              getEl('btn-type-takeaway').style.background = 'var(--primary)';
              getEl('btn-type-takeaway').style.color = '#fff';
              getEl('btn-type-dinein').style.background = 'transparent';
              getEl('btn-type-dinein').style.color = 'var(--t2)';
            }
          }
        },
              queueManager: {
             timer: null,
             open: function() {
                 ui.openModal('modal-k-queue');
                 kasir.queueManager.fetch();
                 this.timer = setInterval(function() { kasir.queueManager.fetch(); }, 10000);
             },
             close: function() {
                 clearInterval(this.timer);
                 ui.closeModal('modal-k-queue');
             },
             fetch: function() {
                 google.script.run.withSuccessHandler(function(res) {
                     if(res.success) kasir.queueManager.render(res.data);
                 }).getActiveQueues();
             },
             render: function(data) {
                 var sortedData = data.slice().reverse();
                 var html = sortedData.map(function(q) {
                     var btn = '';
                     if(q.status === 'Masuk' || q.status === 'Diproses') btn = '<button class="btn btn-success" style="padding:6px 12px;font-size:12px;" onclick="kasir.queueManager.update(\''+q.id+'\', \'Selesai\', \''+q.qNum+'\')">Selesai & Panggil</button>';
                     else if(q.status === 'Selesai') btn = '<button class="btn btn-outline" style="padding:6px 12px;font-size:12px;" onclick="kasir.queueManager.recall(\''+q.qNum+'\')"><i class="fas fa-bullhorn"></i> Panggil Lagi</button>';
                     var delBtn = '<button class="btn btn-danger" style="padding:6px 12px;font-size:12px;margin-left:8px;" onclick="kasir.queueManager.update(\''+q.id+'\', \'Dihapus\')"><i class="fas fa-trash"></i></button>';
                     var itemsHtml = q.items.map(function(i) { return '<div style="font-size:12px;color:var(--t2);">x'+i.qty+' '+i.name+'</div>'; }).join('');
                     return '<div class="card flex items-center" style="gap:16px;">' +
                         '<div style="flex:1;">' +
                             '<div style="font-size:18px;font-weight:bold;margin-bottom:4px;">'+q.qNum+' <span class="badge" style="font-size:10px;">'+q.status+'</span></div>' +
                             '<div style="color:var(--t1);font-size:13px;font-weight:600;">Pelanggan: '+q.customer+'</div>' +
                             '<div style="margin-top:8px;">'+itemsHtml+'</div>' +
                         '</div>' +
                         '<div style="display:flex;align-items:center;">'+btn+delBtn+'</div>' +
                     '</div>';
                 }).join('');
                 if(!html) html = '<div style="text-align:center;padding:40px;color:var(--t3);">Tidak ada antrean aktif</div>';
                 getEl('kq-list').innerHTML = html;
             },
             update: function(id, status, qNum) {
                   ui.showLoader('Update status...');
                   google.script.run.withSuccessHandler(function(res) {
                       ui.hideLoader();
                       kasir.queueManager.fetch();
                   }).updateQueueStatus(id, status, qNum);
               },
             recall: function(qNum) {

                addToCartWithOpts: function(id, fullName, customPrice) {
          var c = app.state.data.catalog.find(function (x) { return x.ID === id; });
          if (!c) return false;
          var isTrack = String(c.TrackStok) === 'true';
          var maxStock = Number(c.StokProduk) || 0;
          var oType = (String(app.state.data.settings.RequireOrderType) === 'true') ? app.state.currentOrderType : '';
          
          if (isTrack) {
             var totalQty = 0;
             app.state.cart.forEach(function(item) { if(item.id === id) totalQty += item.qty; });
             if ((totalQty + 1) > maxStock) {
                ui.showToast('Stok tidak mencukupi untuk ' + c.NamaMenu, 'error');
                return false;
             }
          }
          var ex = app.state.cart.find(function (i) { return i.id === id && i.name === fullName && i.orderType === oType; });
          if (ex) {
            ex.qty++;
          } else {
            var p = customPrice !== null ? customPrice : Number(c.Harga);
            app.state.cart.push({ cartId: Date.now() + '_' + Math.floor(Math.random()*1000), id: c.ID, name: fullName, price: p, kode: c.KodeMenu, qty: 1, orderType: oType });
          }
          kasir.renderCart();
          return true;
        },
                      updateQty: function (cartId, delta) {
          var i = app.state.cart.findIndex(function (x) { return x.cartId === cartId; });
          if (i > -1) {
            if (delta > 0) {
              var c = app.state.data.catalog.find(function(x) { return x.ID === app.state.cart[i].id; });
              if (c && String(c.TrackStok) === 'true') {
                 var totalQty = 0;
                 app.state.cart.forEach(function(item) { if(item.id === c.ID) totalQty += item.qty; });
                 if ((totalQty + delta) > (Number(c.StokProduk) || 0)) {
                    ui.showToast('Stok ' + c.NamaMenu + ' tidak mencukupi!', 'error');
                    return;
                 }
              }
            }
            app.state.cart[i].qty += delta; 
            if (app.state.cart[i].qty <= 0) app.state.cart.splice(i, 1); 
          }
          kasir.renderCart();
        },

      addExpenseItem: function () {
        var sel = getEl('exp-stock-sel').value;
        var qty = Number(getEl('exp-qty').value);
        var price = Number(getEl('exp-price').value);

        if (qty <= 0 || price <= 0) return ui.showToast('Masukkan Qty dan Nominal yang valid!', 'error');

        if (sel === 'lainnya') {
          var n = getEl('exp-new-name').value;
          var s = getEl('exp-new-satuan').value;
          var b = getEl('exp-new-batas').value;
          var add = getEl('exp-add-tostock').checked;
          if (!n) return ui.showToast('Nama barang baru harus diisi!', 'error');

          owner.expenseCart.push({
            isLainnya: true,
            id: 'lainnya',
            name: n,
            satuan: s,
            batas: b,
            add_to_stock: add,
            qty: qty,
            price: price
          });
          getEl('exp-new-name').value = '';
        } else {
          if (!sel) return ui.showToast('Pilih stok terlebih dahulu!', 'error');
          var name = getEl('exp-stock-sel').options[getEl('exp-stock-sel').selectedIndex].text;
          owner.expenseCart.push({
            isLainnya: false,
            id: sel,
            name: name,
            qty: qty,
            price: price
          });
        }

        getEl('exp-price').value = '';
        getEl('exp-qty').value = '1';
        owner.renderExpenseCart();
      },
      removeExpenseItem: function (idx) {
        owner.expenseCart.splice(idx, 1);
        owner.renderExpenseCart();
      },
      renderExpenseHistory: function () {
        var d = getEl('exp-history-date').value;
        var exp = app.state.data.expenses;
        if (d) exp = exp.filter(function (e) { return String(e.Tanggal).startsWith(d); });
        else {
          var today = new Date().toISOString().split('T')[0];
          exp = exp.filter(function (e) { return String(e.Tanggal).startsWith(today); });
          getEl('exp-history-date').value = today;
        }
        exp.sort(function (a, b) { return new Date(b.Tanggal) - new Date(a.Tanggal); });
        getEl('exp-history-table').querySelector('tbody').innerHTML = exp.map(function (e) {
          return '<tr><td class="tbl-td" style="font-size:11px;">' + new Date(e.Tanggal).toLocaleTimeString() + '</td>' +
            '<td class="tbl-td">' + e.Keterangan + '</td>' +
            '<td class="tbl-td text-right font-bold">' + rp(e.Total) + '</td>' +
            '<td class="tbl-td text-right"><button onclick="owner.deleteExpense(\'' + e.ID + '\')" class="btn btn-danger" style="padding:4px 8px;font-size:11px;"><i class="fas fa-trash"></i></button></td></tr>';
        }).join('');
      },
      deleteExpense: function (id) {
        ui.showConfirm('Hapus Riwayat', 'Hapus riwayat belanja ini?', function() {
          ui.showLoader('Menghapus...');
          google.script.run.withSuccessHandler(function (r) {
            ui.hideLoader();
            if (r.success) { ui.showToast('Terhapus!'); app.refreshData(); }
            else ui.showToast('Gagal menghapus!', 'error');
          }).deleteExpense(id);
        });
      },
      saveExpense: function () {
        if (!owner.expenseCart.length) return ui.showToast('Rincian belanja kosong!', 'error');
        var total = 0;
        var stockItems = [];
        var newStockItems = [];
        var descArr = [];

        owner.expenseCart.forEach(function (item) {
          total += Number(item.price);
          descArr.push(item.name + ' (+' + item.qty + ')');
          if (item.isLainnya) {
            if (item.add_to_stock) {
              newStockItems.push({ nama: item.name, satuan: item.satuan, batas: item.batas, qty: item.qty });
            }
          } else {
            stockItems.push({ id: item.id, qtyAdded: item.qty });
          }
        });

        var d = "Belanja: " + descArr.join(', ');

        ui.showLoader('Menyimpan...');
        google.script.run.withSuccessHandler(function (r) {
          ui.hideLoader();
          if (r.success) {
            ui.showToast('Berhasil dicatat!');
            owner.expenseCart = [];
            owner.renderExpenseCart();
            app.refreshData();
          } else ui.showToast('Gagal!', 'error');
        }).saveExpenseAndStock(d, total, stockItems, newStockItems);
      },
      fillSettings: function () {
        var s = app.state.data.settings;
        getEl('set-name').value = s.StoreName || ''; getEl('set-address').value = s.StoreAddress || '';
        getEl('set-phone').value = s.StorePhone || ''; getEl('set-header').value = s.ReceiptHeader || '';
        getEl('set-footer').value = s.ReceiptFooter || ''; getEl('set-qris').value = s.QrisImage || '';
        getEl('set-logo-preview').innerHTML = s.StoreLogo ? '<img src="' + s.StoreLogo + '" style="width:100%;height:100%;object-fit:cover;">' : '<i class="fas fa-image" style="color:var(--border);font-size:32px;"></i>';
        getEl('set-logo-file').value = '';
      },
      previewLogo: function (e) {
        var f = e.target.files[0];
        if (f) {
          var r = new FileReader();
          r.onload = function (ev) { getEl('set-logo-preview').innerHTML = '<img src="' + ev.target.result + '" style="width:100%;height:100%;object-fit:cover;">'; };
          r.readAsDataURL(f);
        }
      },
      changePassword: function() {
          var o = getEl('k-cp-old').value, n = getEl('k-cp-new').value;
          if (!o || !n) return ui.showToast('Lengkapi data!', 'error');
          ui.showLoader('Menyimpan...');
          google.script.run.withSuccessHandler(function(res) {
            ui.hideLoader();
            if(res.success) { ui.closeModal('modal-k-change-pass'); ui.showToast('Password diubah!'); getEl('k-cp-old').value=''; getEl('k-cp-new').value=''; }
            else ui.showToast(res.message, 'error');
          }).changePassword(app.state.user, o, n);
        },
        saveSettings: function () {
        var obj = { StoreName: getEl('set-name').value, StoreAddress: getEl('set-address').value, StorePhone: getEl('set-phone').value, ReceiptHeader: getEl('set-header').value, ReceiptFooter: getEl('set-footer').value, QrisImage: getEl('set-qris').value };
        var f = getEl('set-logo-file').files[0];
        ui.showLoader('Menyimpan...');
        var doSave = function () {
          google.script.run.withSuccessHandler(function () { ui.hideLoader(); ui.showToast('Tersimpan!'); app.refreshData(); }).saveAllSettings(obj);
        };
        if (f) {
          var r = new FileReader();
          r.onload = function (ev) { 
              var img = new Image();
              img.onload = function() {
                  var canvas = document.createElement('canvas');
                  var maxW = 250, maxH = 250;
                  var w = img.width, h = img.height;
                  if (w > maxW || h > maxH) {
                      if (w > h) { h *= maxW / w; w = maxW; } else { w *= maxH / h; h = maxH; }
                  }
                  canvas.width = w; canvas.height = h;
                  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                  // Compress as lightweight WebP/JPEG Base64 string directly compatible across all devices
                  obj.StoreLogoBase64 = canvas.toDataURL('image/webp', 0.8);
                  doSave();
              };
              img.src = ev.target.result;
          };
          r.readAsDataURL(f);
        } else {
          doSave();
        }
      },
      savePin: function () {
        var pin = getEl('set-pin').value; if (pin.length !== 6) return ui.showToast('PIN wajib 6 digit!', 'error');
        ui.showLoader('Menyimpan...');
        google.script.run.withSuccessHandler(function () { ui.hideLoader(); ui.showToast('PIN diubah!'); getEl('set-pin').value = ''; app.refreshData(); }).saveAllSettings({ KasirPin: pin });
      },
      changePassword: function () {
        var np = getEl('set-pwd-new').value; if (np.length < 4) return ui.showToast('Min 4 karakter!', 'error');
        ui.showLoader('Memproses...');
        google.script.run.withSuccessHandler(function (r) { ui.hideLoader(); if (r.success) { ui.showToast('Password diubah!'); getEl('set-pwd-new').value = ''; } else ui.showToast(r.message, 'error'); }).changePassword('owner', np);
      },
      modals: {
        stock: {
          open: function () { getEl('ms-title').innerText = 'Tambah Stok'; getEl('ms-id').value = ''; getEl('ms-nama').value = ''; getEl('ms-qty').value = ''; getEl('ms-satuan').value = 'pcs'; getEl('ms-batas').value = '5'; ui.openModal('modal-stock'); },
          edit: function (id) { var s = app.state.data.stock.find(function (x) { return x.ID === id; }); if (!s) return; getEl('ms-title').innerText = 'Edit Stok'; getEl('ms-id').value = id; getEl('ms-nama').value = s.NamaBarang; getEl('ms-qty').value = s.Qty; getEl('ms-satuan').value = s.Satuan; getEl('ms-batas').value = s.BatasMinimum; ui.openModal('modal-stock'); },
          save: function () {
            var data = { action: getEl('ms-id').value ? 'edit' : 'add', ID: getEl('ms-id').value, NamaBarang: getEl('ms-nama').value, Qty: Number(getEl('ms-qty').value), Satuan: getEl('ms-satuan').value, BatasMinimum: Number(getEl('ms-batas').value) };
            if (!data.NamaBarang) return ui.showToast('Nama barang wajib!', 'error');
            ui.showLoader('Menyimpan...');
            google.script.run.withSuccessHandler(function () { ui.hideLoader(); ui.closeModal('modal-stock'); ui.showToast('Berhasil!'); app.refreshData(); owner.populateSelects(); }).saveStock(data);
          },
          del: function (id) { ui.showConfirm('Hapus Stok', 'Hapus stok ini?', function() { ui.showLoader('Menghapus...'); google.script.run.withSuccessHandler(function () { ui.hideLoader(); ui.showToast('Terhapus!'); app.refreshData(); }).saveStock({ action: 'delete', ID: id }); }); }
        },
        catalog: {
          stockRows: [],
          optionGroups: [],
          addOptionGroup: function() {
              this.optionGroups.push({ id: Date.now(), title: '', items: [] });
              this.renderOptions();
          },
          removeOptionGroup: function(gId) {
              this.optionGroups = this.optionGroups.filter(function(g) { return g.id !== gId; });
              this.renderOptions();
          },
          addOptionItem: function(gId) {
              var g = this.optionGroups.find(function(g) { return g.id === gId; });
              if(g) { g.items.push({ id: Date.now(), name: '', price: '', linkedId: '' }); this.renderOptions(); }
          },
          removeOptionItem: function(gId, iId) {
              var g = this.optionGroups.find(function(g) { return g.id === gId; });
              if(g) { g.items = g.items.filter(function(i) { return i.id !== iId; }); this.renderOptions(); }
          },
          updateOptionGroup: function(gId, val) {
              var g = this.optionGroups.find(function(g) { return g.id === gId; });
              if(g) g.title = val;
          },
          updateOptionItem: function(gId, iId, field, val) {
              var g = this.optionGroups.find(function(g) { return g.id === gId; });
              if(g) {
                 var i = g.items.find(function(x) { return x.id === iId; });
                 if(i) i[field] = val;
              }
          },
          renderOptions: function() {
              var catOpts = '<option value="">(Teks Saja, Bukan Produk)</option>' + app.state.data.catalog.map(function(c) { return '<option value="'+c.ID+'">'+c.NamaMenu+'</option>'; }).join('');
              
              var html = this.optionGroups.map(function(g) {
                  var itemsHtml = g.items.map(function(i) {
                      var sel = catOpts.replace('value="'+i.linkedId+'"', 'value="'+i.linkedId+'" selected');
                      return '<div class="flex gap-2 items-center" style="margin-top:8px;">' +
                         '<input type="text" class="form-input" style="flex:1;padding:6px 8px;font-size:12px;" placeholder="Nama Opsi (Level 1, dll)" value="'+i.name+'" onchange="owner.modals.catalog.updateOptionItem('+g.id+', '+i.id+', \'name\', this.value)">' +
                         '<input type="number" class="form-input" style="width:90px;padding:6px 8px;font-size:12px;" placeholder="+Harga" value="'+(i.price||'')+'" onchange="owner.modals.catalog.updateOptionItem('+g.id+', '+i.id+', \'price\', this.value)">' +
                         '<select class="form-input" style="flex:1;padding:6px 8px;font-size:12px;" onchange="owner.modals.catalog.updateOptionItem('+g.id+', '+i.id+', \'linkedId\', this.value)">'+sel+'</select>' +
                         '<button class="btn btn-danger" style="padding:6px 10px;" onclick="owner.modals.catalog.removeOptionItem('+g.id+', '+i.id+')"><i class="fas fa-trash"></i></button>' +
                      '</div>';
                  }).join('');
                  
                  return '<div style="background:#fff;padding:12px;border:1px solid var(--border);border-radius:8px;">' +
                     '<div class="flex items-center gap-2">' +
                       '<input type="text" class="form-input" style="font-weight:bold;" placeholder="Judul Grup (misal: Level Pedas)" value="'+g.title+'" onchange="owner.modals.catalog.updateOptionGroup('+g.id+', this.value)">' +
                       '<button class="btn btn-danger" onclick="owner.modals.catalog.removeOptionGroup('+g.id+')"><i class="fas fa-trash"></i></button>' +
                     '</div>' +
                     '<div style="margin:8px 0;">'+itemsHtml+'</div>' +
                     '<button class="btn btn-outline" style="font-size:11px;padding:4px 8px;" onclick="owner.modals.catalog.addOptionItem('+g.id+')"><i class="fas fa-plus"></i> Tambah Pilihan</button>' +
                  '</div>';
              }).join('');
              getEl('mcat-options-list').innerHTML = html;
          },
          addStockRow: function (id, qty) {
            if (id === undefined) id = '';
            if (qty === undefined) qty = 1;
            var rowId = Date.now() + Math.floor(Math.random() * 1000);
            this.stockRows.push({ tempId: rowId, id: id, qty: qty });
            this.renderStockRows();
          },
          removeStockRow: function (tempId) {
            this.stockRows = this.stockRows.filter(function (r) { return r.tempId !== tempId; });
            this.renderStockRows();
          },
          updateStockRow: function (tempId, field, val) {
            var row = this.stockRows.find(function (r) { return r.tempId === tempId; });
            if (row) row[field] = val;
          },
          renderStockRows: function () {
            var container = getEl('mcat-stock-list');
            if (this.stockRows.length === 0) {
              container.innerHTML = '<div style="font-size:12px;color:var(--t3);text-align:center;padding:12px 0;">Tidak ada relasi stok.</div>';
              return;
            }
            var html = '';
            var opts = '<option value="">- Pilih Stok -</option>' + app.state.data.stock.map(function (s) { return '<option value="' + s.ID + '">' + s.NamaBarang + '</option>'; }).join('');
            this.stockRows.forEach(function (r) {
              var selectOpts = opts.replace('value="' + r.id + '"', 'value="' + r.id + '" selected');
              html += '<div class="flex gap-2 items-center" style="margin-bottom:8px;">';
              html += '<select class="form-input" style="flex:2;padding:8px;font-size:12px;" onchange="owner.modals.catalog.updateStockRow(' + r.tempId + ', \'id\', this.value)">' + selectOpts + '</select>';
              html += '<input type="number" step="1" min="1" class="form-input" style="flex:1;padding:8px;font-size:12px;" value="' + (parseInt(r.qty) || 1) + '" oninput="owner.modals.catalog.updateStockRow(' + r.tempId + ', \'qty\', parseInt(this.value)||1)">';
              html += '<button onclick="owner.modals.catalog.removeStockRow(' + r.tempId + ')" class="btn" style="background:#fef2f2;color:var(--danger);padding:8px;"><i class="fas fa-trash"></i></button>';
              html += '</div>';
            });
            container.innerHTML = html;
          },
          open: function () {
            getEl('mc-title').innerText = 'Tambah Produk';
            getEl('mcat-id').value = '';
            getEl('mcat-nama').value = '';
            getEl('mcat-kategori').value = '';
            getEl('mcat-kode').value = '';
            getEl('mcat-harga').value = '';
              getEl('mcat-track-stok').checked = false;
              getEl('mcat-stok-produk').value = '';
              getEl('mcat-stok-container').classList.add('hidden');
              this.optionGroups = [];
              getEl('mcat-has-options').checked = false;
              getEl('mcat-options-box').classList.add('hidden');
              this.renderOptions();
            this.stockRows = [];
            this.renderStockRows();
            getEl('mcat-preview').innerHTML = '<i class="fas fa-image" style="color:var(--border);font-size:32px;"></i>';
            getEl('mcat-file').value = '';
            ui.openModal('modal-catalog');
          },
          edit: function (id) {
            var c = app.state.data.catalog.find(function (x) { return x.ID === id; });
            if (!c) return;
            getEl('mc-title').innerText = 'Edit Menu';
            getEl('mcat-id').value = id;
            getEl('mcat-nama').value = c.NamaMenu;
            getEl('mcat-kategori').value = c.Kategori || '';
            getEl('mcat-kode').value = c.KodeMenu;
            getEl('mcat-harga').value = c.Harga;
              getEl('mcat-track-stok').checked = (String(c.TrackStok) === 'true');
              getEl('mcat-stok-produk').value = c.StokProduk || '';
              getEl('mcat-stok-container').classList.toggle('hidden', String(c.TrackStok) !== 'true');
              try { this.optionGroups = JSON.parse(c.OptionsJSON || '[]'); } catch(e) { this.optionGroups = []; }
              getEl('mcat-has-options').checked = this.optionGroups.length > 0;
              getEl('mcat-options-box').classList.toggle('hidden', this.optionGroups.length === 0);
              this.renderOptions();

            this.stockRows = [];
            if (c.BahanStockID) {
              var ids = String(c.BahanStockID).split(',').map(function (s) { return s.trim(); });
              var qtys = String(c.QtyPengurang || '1').split(',').map(function (s) { return s.trim(); });
              var self = this;
              ids.forEach(function (sid, idx) {
                if (sid) self.addStockRow(sid, qtys[idx] !== undefined ? qtys[idx] : qtys[0]);
              });
            }
            this.renderStockRows();

            getEl('mcat-preview').innerHTML = '<img src="' + c.FotoURL + '" style="width:100%;height:100%;object-fit:cover;">';
            ui.openModal('modal-catalog');
          },
          previewImage: function (e) { var f = e.target.files[0]; if (f) { var r = new FileReader(); r.onload = function (ev) { getEl('mcat-preview').innerHTML = '<img src="' + ev.target.result + '" style="width:100%;height:100%;object-fit:cover;">'; }; r.readAsDataURL(f); } },
          save: function () {
            var id = getEl('mcat-id').value, f = getEl('mcat-file').files[0];
            var validRows = this.stockRows.filter(function (r) { return r.id && r.id.trim() !== ''; });
            var stockIds = validRows.map(function (r) { return r.id; }).join(',');
            var qtys = validRows.map(function (r) { return parseInt(r.qty) || 1; }).join(',');

            var data = {
              action: id ? 'edit' : 'add',
              ID: id,
              NamaMenu: getEl('mcat-nama').value,
              Kategori: getEl('mcat-kategori').value,
              KodeMenu: getEl('mcat-kode').value,
              Harga: Number(getEl('mcat-harga').value),
                TrackStok: getEl('mcat-track-stok').checked ? 'true' : 'false',
                StokProduk: Number(getEl('mcat-stok-produk').value) || 0,
                OptionsJSON: getEl('mcat-has-options').checked ? JSON.stringify(this.optionGroups) : '[]',
              BahanStockID: stockIds,
              QtyPengurang: qtys
            };
            if (!data.NamaMenu || !data.Harga) return ui.showToast('Nama dan Harga wajib!', 'error');
            ui.showLoader('Menyimpan menu...');
            var doSave = function () { google.script.run.withSuccessHandler(function () { ui.hideLoader(); ui.closeModal('modal-catalog'); ui.showToast('Berhasil!'); app.refreshData(); }).saveCatalog(data); };
            if (f) { var r = new FileReader(); r.onload = function (ev) { data.FotoBase64 = ev.target.result; doSave(); }; r.readAsDataURL(f); } else doSave();
          },
          del: function (id) { ui.showConfirm('Hapus Menu', 'Hapus menu ini?', function() { ui.showLoader('Menghapus...'); google.script.run.withSuccessHandler(function () { ui.hideLoader(); ui.showToast('Terhapus!'); app.refreshData(); }).saveCatalog({ action: 'delete', ID: id }); }); }
        },
        user: {

            save: function () {
              var u = getEl('mu-username').value, p = getEl('mu-pass').value;

              if (!u || !p) return ui.showToast('Lengkapi data!', 'error');
              ui.showLoader('Menyimpan...');
              google.script.run.withSuccessHandler(function (res) { ui.hideLoader(); if (res.success) { ui.closeModal('modal-user'); ui.showToast('User disimpan'); owner.renderUsers(); } else ui.showToast(res.message, 'error'); }).saveUser({ action: this.mode, role: r, username: u, password: p });
            },
            del: function (u) { ui.showConfirm('Hapus User', 'Hapus user ' + u + '?', function() { ui.showLoader('Menghapus...'); google.script.run.withSuccessHandler(function (res) { ui.hideLoader(); if(res.success) { ui.showToast('Terhapus'); owner.renderUsers(); } else { ui.showToast(res.message, 'error'); } }).saveUser({ action: 'delete', username: u }); }); }
          }
        }
    };

    /* ==========================================
       INITIALIZATION - All event bindings here
       ========================================== */
    window.ui = ui;
    window.app = app;
    window.auth = auth;
    window.kasir = kasir;
    window.owner = owner;

    function bindEvents() {
      // Portal buttons
      var bk = getEl('btn-portal-kasir');
      if (bk) bk.addEventListener('click', function () { app.state.isFullscreenMode = true; ui.enterFullscreen(); ui.showLogin('Kasir'); });

      var bo = getEl('btn-portal-owner');
      if (bo) bo.addEventListener('click', function () { app.state.isFullscreenMode = true; ui.enterFullscreen(); ui.showLogin('Owner'); });

      // Login back
      var back = getEl('btn-login-back');
      if (back) back.addEventListener('click', function () { ui.showView('view-portal-select'); });

      // Login submit button (type=button, not submit)
      var lbtn = getEl('btn-login-submit');
      if (lbtn) lbtn.addEventListener('click', function () { auth.login(); });

      // Also handle Enter key on password field
      var pwd = getEl('inp-password');
      if (pwd) pwd.addEventListener('keydown', function (e) { if (e.key === 'Enter') auth.login(); });
      var usr = getEl('inp-username');
      if (usr) usr.addEventListener('keydown', function (e) { if (e.key === 'Enter') { getEl('inp-password').focus(); } });

      // Dropdowns
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.user-dropdown')) {
          var dd = document.querySelector('.user-dropdown-menu');
          if (dd) dd.classList.remove('active');
        }
      });

      var btnLogout = document.querySelectorAll('[id="btn-logout"], .btn-logout');
      btnLogout.forEach(function (b) { b.addEventListener('click', function () { auth.logout(); }); });

      // Enforce fullscreen if user clicks anywhere and it was dropped (e.g. by print dialog)
      document.addEventListener('click', function () {
        if (app.state && app.state.isFullscreenMode) {
          var isFull = document.fullscreenElement || document.mozFullScreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
          if (!isFull) ui.enterFullscreen();
        }
      });
      
      window.addEventListener('afterprint', function() {
        if (app.state && app.state.isFullscreenMode) {
          ui.enterFullscreen();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      app.init();
      bindEvents();
      // Show portal select
      ui.showView('view-portal-select');
    });
  </script>
